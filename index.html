<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIP — Class 3 Questions</title>
<style>
:root{--accent:#0b63d5;--muted:#666;--good:#c9f1d0;--bad:#ffd6d6;--card:#fff;--bg:#f3f8ff;}
body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg);margin:0;padding:18px}
header{display:flex;align-items:center;gap:12px;margin-bottom:15px}
h1{margin:0;color:var(--accent);font-size:22px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
button{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
button.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
#scoreBox{margin-left:auto;font-weight:bold;color:#083a8a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.column{display:flex;flex-direction:column;gap:10px}
.card{background:#fff;padding:10px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.qnum{display:none}
.qtext{font-size:16px}
.ansBox{width:120px;padding:6px;font-size:15px}
#resultsPanel{display:none;margin-top:18px;background:#fff;padding:12px;border-left:5px solid var(--accent);border-radius:8px;max-height:50vh;overflow:auto}
.sol{padding:8px;border-radius:6px;margin-bottom:6px}
.correct{background:var(--good)}
.incorrect{background:var(--bad)}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

@media print{
  .controls,
  #scoreBox,
  #resultsPanel,
  footer,
  header img{
    display:none !important;
  }

  body{
    background:#fff;
    margin:0;
    padding:0;
  }

  header{
    margin-bottom:18px;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .card{
    box-shadow:none;
    border:1px solid #bbb;
    break-inside:avoid;
    page-break-inside:avoid;
  }

  .ansBox{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid #000;
    background:#fff;
    width:60px;
    height:22px;
  }
}

</style>
</head>
<body>

<header>
<div>
<h1>SIP Round - Class 3  Questions</h1>
<div style="color:#666">Addition & Subtraction</div>
</div>
<div id="scoreBox">Not yet attempted</div>
</header>

<div class="controls">
<label style="display:flex;align-items:center;font-weight:bold;">
Questions:&nbsp;
<select id="questionCount" style="padding:6px;border-radius:6px;">
<option value="100">100</option>
<option value="200">200</option>
<option value="300" selected>300</option>
</select>
</label>
<button id="btnCheck">Check Answers</button>
<button id="btnReset" class="ghost">New Set</button>
<button id="btnShow">Show Solutions</button>
<button onclick="window.print()" class="ghost">Print / Save PDF</button>
</div>

<div class="grid">
<div class="column" id="left"></div>
<div class="column" id="right"></div>
</div>

<div id="resultsPanel">
<div id="summary"></div>
<div id="solutions"></div>
</div>

<script>
let TOTAL=300;
const questionSelect=document.getElementById("questionCount");

const OPS=["+","-"];
let current=[];

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function genArithmetic(){
 let op=OPS[rand(0,1)];
 let a,b,answer;

 if(op==="+"){
    let t=rand(1,100);

    if(t<=20){
        a=rand(10,99);
        b=rand(10,99);
    }else if(t<=60){
        a=rand(100,999);
        b=rand(10,99);
    }else{
        a=rand(100,999);
        b=rand(100,999);
    }

    answer=a+b;
 }else{

    let t=rand(1,100);

    if(t<=40){
        a=rand(100,999);
        b=rand(10,99);
    }else{
        a=rand(100,999);
        b=rand(100,999);
        if(b>a){let x=a;a=b;b=x;}
    }

    answer=a-b;
 }

 return {text:`${a} ${op} ${b} =`,correct:answer};
}

function build(){
 TOTAL=Number(questionSelect.value);
 current=[];
 for(let i=1;i<=TOTAL;i++){
   let q=genArithmetic();
   current.push({id:i,qtext:q.text,correct:q.correct});
 }
 render();
}

function render(){
 left.innerHTML="";
 right.innerHTML="";
 current.forEach((q,i)=>{
   let c=document.createElement("div");
   c.className="card";
   c.innerHTML=`<div><span class="qtext">${q.qtext}</span></div>
   <div style="margin-top:8px">
   <input type="number" class="ansBox" id="ans-${q.id}">
   </div>`;
   (i%2==0?left:right).appendChild(c);
 });
 document.getElementById("resultsPanel").style.display="none";
 document.getElementById("scoreBox").textContent="Not yet attempted";
}

function check(){
 let score=0;
 solutions.innerHTML="";
 current.forEach(q=>{
   let val=document.getElementById("ans-"+q.id).value.trim();
   let n=(val==="")?null:Number(val);
   let d=document.createElement("div");
   if(n!==null && !Number.isNaN(n) && n===q.correct){
      score++;
      d.className="sol correct";
      d.innerHTML=`<b>Q${q.id}</b> ✓ Your answer: <b>${n}</b>`;
   }else{
      d.className="sol incorrect";
      d.innerHTML=`<b>Q${q.id}</b> ✗ Your answer: ${val||"No answer"} | Correct: <b>${q.correct}</b>`;
   }
   solutions.appendChild(d);
 });
 scoreBox.textContent=`Score: ${score} / ${TOTAL}`;
 summary.innerHTML=`<b>Result:</b> ${score} / ${TOTAL}`;
 resultsPanel.style.display="block";
}

function showSolutions(){
 solutions.innerHTML="";
 current.forEach(q=>{
   let d=document.createElement("div");
   d.className="sol correct";
   d.innerHTML=`<b>Q${q.id}</b> ${q.qtext} <b>${q.correct}</b>`;
   solutions.appendChild(d);
 });
 summary.innerHTML="<b>All Solutions</b>";
 resultsPanel.style.display="block";
}

btnCheck.onclick=check;
btnShow.onclick=showSolutions;
btnReset.onclick=()=>{
 if([...document.querySelectorAll(".ansBox")].some(x=>x.value.trim()!=="")){
   if(!confirm("Generate a new set?")) return;
 }
 
questionSelect.onchange=()=>build();
build();
};

build();
</script>
</body>
</html>
